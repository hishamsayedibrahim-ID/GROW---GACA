:root{
  color-scheme:light;
  --navy:#140046; --indigo:#323C73; --blue:#2332E6; --periwinkle:#5965EC;
  --mint:#23EBA5; --mint-tint:#D3FBED; --mint-deep:#1AB07C; --mint-dark:#127653;
  --white:#FFFFFF; --cloud:#EBEBEB; --gray:#CCCCCC; --gray-mid:#808080; --charcoal:#4B4B4B;
  --danger:#B42318; --danger-tint:#FDECEA;
  --f-head:"Co Headline", "Co Text", "Segoe UI", Tahoma, sans-serif;
  --f-text:"Co Text", "Segoe UI", Tahoma, system-ui, sans-serif;
  --r-panel:30px; --r-tile:26px; --r-inner:16px; --r-ctl:8px;
}
*{box-sizing:border-box}
body{background:var(--white);color:var(--navy);font-family:var(--f-text);font-weight:400;font-size:17px;line-height:1.8;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 40px}
h1,h2,h3{font-family:var(--f-head);font-weight:700;line-height:1.4;text-wrap:balance;margin:0}
p{margin:0}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.wrap{max-width:760px;margin:0 auto}
.label{font-size:.88rem;color:var(--charcoal);font-weight:700}
.en{font-family:var(--f-text);font-weight:700;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:2px solid var(--navy);background:var(--white);color:var(--navy);
  padding:.45em 1.3em;border-radius:var(--r-ctl);cursor:pointer;font-weight:700;font-size:1rem;min-height:48px;transition:background-color .15s,color .15s,border-color .15s}
.btn:hover{background:var(--cloud)}
.btn.primary{background:var(--navy);color:var(--white)}
.btn.primary:hover{background:var(--indigo);border-color:var(--indigo)}
.btn.primary:disabled{background:var(--gray);border-color:var(--gray);color:var(--white);cursor:not-allowed}
.btn.link{background:none;border:none;color:var(--charcoal);font-weight:400;font-size:.9rem;min-height:40px;padding:.3em .6em;text-decoration:underline;text-underline-offset:4px}
.btn.link:hover{color:var(--navy);background:none}
.btn.big{font-size:1.1rem;padding:.55em 2em;min-height:54px}

/* header: logo and title on opposite sides */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:18px 14px;border-bottom:2px solid var(--mint);margin-bottom:28px}
.title-side{display:flex;flex-direction:column;gap:0;min-width:0}
.title-side b{font-family:var(--f-head);font-size:1.15rem}
.title-side .en{color:var(--charcoal);font-size:.64rem}
.logo{width:140px;height:auto;display:block}
.tools-row{display:flex;gap:8px;align-items:center}
.confirmbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.95rem}

/* intro */
.intro{display:grid;gap:28px}
.cover{background:var(--navy);color:var(--white);border-radius:var(--r-tile);padding:36px 32px;display:grid;gap:10px}
.cover .en{color:var(--mint)}
.cover h1{font-size:clamp(2.3rem,8vw,3.4rem);line-height:1.25}
.cover .sub{font-size:1.25rem;font-weight:300}
.cover .sub-en{font-size:.95rem;font-weight:300;color:var(--gray)}
.story-wrap{display:flex;gap:20px;align-items:center}
.story-wrap .av{width:112px;height:112px}
.story{flex:1;min-width:0;font-weight:300;font-size:1.18rem;line-height:2;display:grid;gap:10px;background:var(--mint-tint);border-inline-start:6px solid var(--mint-deep);border-radius:var(--r-inner);padding:20px 24px}
.goal-box{border-inline-start:2px solid var(--mint);padding-inline-start:16px}
.goal-box h2{font-size:1.05rem;margin-bottom:2px;color:var(--blue)}
.grow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;list-style:none;margin:0;padding:0}
.grow li{border:2px solid var(--cloud);border-radius:var(--r-inner);padding:14px 10px;display:grid;gap:2px;text-align:center}
.grow .num{font-weight:700;color:var(--mint-deep);font-size:.85rem;font-variant-numeric:tabular-nums}
.grow b{font-family:var(--f-head);font-size:1.05rem;color:var(--blue)}
.grow span{font-size:.82rem;color:var(--charcoal);line-height:1.5}
.start{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:.86rem;color:var(--charcoal)}

/* progress */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;list-style:none;margin:0 0 10px;padding:0}
.steps li{border-top:4px solid var(--cloud);padding-top:6px;font-size:.92rem;color:var(--gray-mid)}
.steps li.done{border-color:var(--mint-deep);color:var(--navy)}
.steps li.now{border-color:var(--blue);color:var(--blue);font-weight:700}
.statusline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:24px;font-size:.92rem;color:var(--charcoal)}
.trust{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap}
.trust b{color:var(--blue)}
.av{display:block;border-radius:50%;flex-shrink:0;max-width:100%}
.trust .av{width:52px;height:52px}
.dots{display:inline-flex;gap:4px}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--cloud)}
.dots i.on{background:var(--blue)}

/* conversation */
.chat{display:grid;gap:14px;margin-bottom:22px}
.sep{text-align:center;font-size:.82rem;font-weight:700;color:var(--mint-dark);display:flex;gap:10px;align-items:center}
.sep::before,.sep::after{content:"";flex:1;height:2px;background:var(--mint)}
.msg{max-width:88%;display:grid;gap:2px}
.msg .who{font-size:.8rem;color:var(--charcoal);font-weight:700}
.msg.me{justify-self:end;background:var(--cloud);border-radius:var(--r-inner) var(--r-inner) var(--r-inner) 4px;padding:10px 16px}
.msg.her{justify-self:start;grid-template-columns:44px minmax(0,1fr);column-gap:12px;align-items:start}
.msg.her .av{width:44px;height:44px;margin-top:4px}
.msg.her > div{display:grid;gap:2px;min-width:0}
.msg.her .who{color:var(--blue)}
.msg.her .txt{font-weight:300;font-size:1.22rem;line-height:1.9}

.card{background:var(--white);border:2px solid var(--cloud);border-radius:var(--r-inner);padding:22px;display:grid;gap:14px}
.scene{font-weight:300;font-size:1.12rem;color:var(--charcoal)}
.scene q{color:var(--blue);font-weight:400;quotes:"«" "»"}
.card h2{font-size:1.05rem}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;text-align:start;width:100%;background:var(--white);
  border:2px solid var(--cloud);border-radius:var(--r-ctl);padding:12px 14px;cursor:pointer;line-height:1.7;transition:border-color .15s,background-color .15s}
.opt:hover{border-color:var(--mint)}
.opt[aria-checked="true"]{border-color:var(--mint-deep);background:var(--mint-tint)}
.opt .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--gray-mid);margin-top:6px;display:grid;place-items:center}
.opt[aria-checked="true"] .dot{border-color:var(--navy)}
.opt[aria-checked="true"] .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--navy)}
.row{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;align-items:center}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill.good{color:var(--mint-dark);background:var(--mint-tint)}
.pill.trap{color:var(--danger);background:var(--danger-tint)}
.fb{border:none;border-inline-start:6px solid var(--gray)}
.fb.good{background:var(--mint-tint);border-inline-start-color:var(--mint-deep)}
.fb.trap{background:var(--danger-tint);border-inline-start-color:var(--danger)}
.fb.good .pill.good{background:var(--white)}
.fb.trap .pill.trap{background:var(--white)}
.fb h2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:1.15rem}
.fb .shift{font-size:.9rem;color:var(--charcoal);display:flex;align-items:center;gap:10px}
.fb .shift .av{width:40px;height:40px}

.fac{border:2px dashed var(--periwinkle);border-radius:var(--r-ctl);padding:12px 14px;font-size:.9rem;display:grid;gap:4px}
.fac b{color:var(--periwinkle)}
.facmeta{display:block;font-size:.8rem;color:var(--charcoal);margin-top:4px}

/* end */
.end{display:grid;gap:40px}
.end-top{display:grid;gap:16px}
.end-top h1{font-size:clamp(1.8rem,6vw,2.4rem)}
.quote-wrap{display:flex;gap:20px;align-items:center}
.quote-wrap .av{width:104px;height:104px}
.quote{flex:1;min-width:0;position:relative;font-weight:300;font-size:1.3rem;color:var(--blue);background:var(--mint-tint);border:6px solid var(--mint-deep);border-radius:var(--r-panel);padding:24px 28px 22px}
.quote::before{content:"”";position:absolute;top:-6px;inset-inline-start:18px;font-size:3.4rem;line-height:1;color:var(--blue);transform:scaleX(-1)}
.quote span{display:block;padding-top:18px}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font-family:var(--f-head);font-size:2.6rem;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;line-height:1.1}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--cloud)}
.bar span{background:var(--mint-deep)}
section.part{display:grid;gap:14px;scroll-margin-top:16px}
section.part > h2{font-size:1.4rem;padding-bottom:8px;border-bottom:2px solid var(--mint)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.three .card{gap:6px;padding:16px;align-content:start}
.three h3{font-size:1rem}
.three p{font-size:.92rem;color:var(--charcoal);line-height:1.7}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.two .card{align-content:start}
.two .card.mine{border-color:var(--navy)}
.two h3{font-size:1.1rem}
.two ul{margin:0;padding-inline-start:1.1em;display:grid;gap:6px;font-size:.95rem}
.levels{display:grid;gap:10px}
.lv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;border:2px solid var(--cloud);border-radius:var(--r-inner);padding:12px 16px}
.lv .what{font-size:.88rem;color:var(--charcoal);grid-column:1/-1}
.lv .lvl{font-weight:700;color:var(--blue)}
details{font-size:.92rem}
details summary{cursor:pointer;color:var(--blue);font-weight:700}
details .inner{margin-top:8px;color:var(--charcoal);display:grid;gap:6px}
.review{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.review li{border:2px solid var(--cloud);border-radius:var(--r-inner);padding:14px 16px;display:grid;gap:6px}
.review .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.review .better{font-size:.92rem;background:var(--mint-tint);border-radius:var(--r-ctl);padding:8px 12px}
.review .better b{color:var(--mint-dark)}
.reflect{display:grid;gap:14px}
.reflect label{font-weight:700;display:block;margin-bottom:4px}
.reflect textarea{width:100%;min-height:84px;padding:10px 12px;border:2px solid var(--cloud);border-radius:var(--r-ctl);background:var(--white);resize:vertical;line-height:1.7}
.reflect textarea:focus{border-color:var(--mint-deep);outline:none}
.ok{font-size:.9rem;color:var(--mint-dark);min-height:1.5em}

.foot{margin-top:44px;padding-top:12px;border-top:2px solid var(--cloud);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.82rem;color:var(--charcoal)}

@media (max-width:640px){
  .story-wrap,.quote-wrap{flex-direction:column;align-items:stretch}
  .story-wrap .av,.quote-wrap .av{width:88px;height:88px;align-self:center}
  .grow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .three,.two{grid-template-columns:1fr}
  .msg{max-width:94%}
  .card{padding:16px}
  .cover{padding:28px 22px}
  .logo{width:124px}
}
@media (prefers-reduced-motion:no-preference){
  .enter{animation:enter .2s ease-out}
  @keyframes enter{from{transform:translateY(4px)}to{transform:none}}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

function compute(hist){
  const s={open:1, prio:false, fear:false, sc:{g:0,r:0,o:0,c:0}, used:{}, ret:null, node:"G1", log:[], good:0, trap:0};
  for(const cid of hist){
    if(s.node==="END") break;
    const id=s.node, node=NODES[id], list=choicesFor(id,s), ch=list.find(c=>c.id===cid);
    if(!ch) break;
    const was={prio:s.prio, fear:s.fear}, from=s.open;
    s.open=clamp(s.open+(ch.open||0),-3,8);
    const r=val(ch.say,s); let reply=r;
    if(typeof r==="object"){ reply=r.t; Object.assign(s,r.set||{}); }
    if(ch.set) Object.assign(s,ch.set);
    if(s.fear) s.prio=true;
    const d=val(ch.sc,s)||{}; for(const k in d) s.sc[k]+=d[k];
    TYPES[ch.type].good ? s.good++ : s.trap++;
    const better = TYPES[ch.type].good ? null : list.find(c=>c.id!==cid && TYPES[c.type].good);
    s.log.push({id, area:node.area, back:!!node.back, type:ch.type, text:val(ch.text,s), reply, fb:val(ch.fb,s), d, from, to:s.open,
      revealed:(!was.prio&&s.prio)||(!was.fear&&s.fear), better: better ? {type:better.type, text:val(better.text,s)} : null});
    const target = ch.revisit ? val(ch.revisit,s) : undefined;
    if(ch.revisit){ s.used[id]=true; if(target){ s.ret=id; s.node=target; } else s.node=id; }
    else if(node.back){ s.node=s.ret; s.ret=null; }
    else s.node=node.next;
  }
  return s;
}
const level=(k,p)=>{ const b=DIMS[k].bands; return p<=b[0]?0 : p<=b[1]?1 : 2; };

    $("[data-act=reset-yes]").focus(); return;
  }
  t.innerHTML = st.screen==="intro" ? "" : `<button class="btn link" data-act="reset">ابدأ من جديد</button>`;
  $("#fac-btn").textContent = st.fac ? "إخفاء وضع الميسّر" : "وضع الميسّر";
  $("#fac-btn").setAttribute("aria-pressed", st.fac);
}

function intro(){
  $("#app").innerHTML=`<div class="intro enter">
    <div class="cover"><span class="en" lang="en" dir="ltr">Interactive simulation · GROW coaching</span><h1>فخ النصيحة</h1><p class="sub">هل تستطيع أن تساعد موظفك، دون أن تحلّ المشكلة عنه؟</p><p class="sub-en" lang="en" dir="ltr">The Advice Trap · Can you coach without fixing?</p></div>
    <div class="story-wrap">${av(1)}<div class="story">
      <p>سارة من أفضل موظفيك منذ أربع سنوات.</p>
      <p>لكن في الأشهر الثلاثة الأخيرة تأخرت في موعدين، وجاء تقريرها الأخير بأخطاء، وصارت صامتة في الاجتماعات.</p>
      <p>طلبتَ جلسة معها لمدة ثلاثين دقيقة. وأنت تعرف تقريبًا ماذا يجب أن تفعل. لكن هل سيفيد أن تقول لها ذلك؟</p>
    </div></div>
    <div class="goal-box"><h2>هدف التمرين</h2><p>أن تستخدم نموذج GROW لتساعد سارة على إيجاد حلها بنفسها، وأن تنتبه حين تجذبك الرغبة في النصيحة.</p></div>
    <ul class="grow" aria-label="مراحل الجلسة">
      <li><span class="num">01</span><b>الهدف</b><span>ماذا تريد؟</span></li>
      <li><span class="num">02</span><b>الواقع</b><span>ماذا يحدث فعلًا؟</span></li>
      <li><span class="num">03</span><b>الخيارات</b><span>ماذا يمكنها أن تفعل؟</span></li>
      <li><span class="num">04</span><b>الالتزام</b><span>ماذا ستفعل، ومتى؟</span></li>
    </ul>
    <p>في كل خطوة: اختر ما ستقوله، وشاهد ردّ سارة. 12 قرارًا، حوالي 15 دقيقة.</p>
    <div class="start">
      <button class="btn primary big" data-act="start">ابدأ الجلسة</button>
      ${st.hist.length?`<button class="btn" data-act="resume">أكمل من حيث توقفت</button>`:""}
    </div>
    <p class="note">التقييم في النهاية للتأمل والنقاش فقط، وليس اختبارًا معتمدًا لقياس الأشخاص.</p>
  </div>`;
}

function sim(focus){
  const s=compute(st.hist);
  if(s.node==="END" && !st.waiting){ st.screen="end"; save(); return render("#end-h"); }
  const done=new Set(s.log.filter(l=>!l.back).map(l=>l.id));
  const cur = s.node==="END" ? null : NODES[s.node].area;
  const n=s.log.filter(l=>!l.back).length;
  const m=moodOf(s.open);
  let h=`<ol class="steps" aria-label="التقدم">${Object.keys(AREAS).map(a=>{
      const all=CORE.filter(id=>NODES[id].area===a).every(id=>done.has(id));
      return `<li class="${a===cur?"now":all?"done":""}" ${a===cur?'aria-current="step"':""}>${AREAS[a].name}</li>`;}).join("")}</ol>
    <div class="statusline"><span>القرار ${Math.min(n+(st.waiting?0:1),12)} من 12</span>
      <span class="trust">${av(m,"")}<span>سارة الآن: <b>${MOODS[m]}</b></span><span class="dots" aria-hidden="true">${[0,1,2,3].map(i=>`<i class="${i<=m?"on":""}"></i>`).join("")}</span></span></div>`;

  let last=null;
  h+=`<div class="chat">`+s.log.map(l=>{
    let sep=""; const key=l.area+(l.back?"b":"");
    if(key!==last){ sep=`<div class="sep">${AREAS[l.area].name}${l.back?" (رجوع)":""}</div>`; last=key; }
    return sep+`<div class="msg me"><span class="who">أنت</span><span>${esc(l.text)}</span></div>
      <div class="msg her">${av(moodOf(l.to),"")}<div><span class="who">سارة</span><span class="txt">${esc(l.reply)}</span></div></div>`;
  }).join("")+`</div>`;

  if(st.waiting){
    const l=s.log[s.log.length-1], g=TYPES[l.type].good;
    h+=`<section class="card fb ${g?"good":"trap"} enter" aria-labelledby="fb-h">
      <h2 id="fb-h" tabindex="-1">${g?"أحسنت":"انتبه، هذا فخ"} ${pill(l.type)}</h2>
      <p>${esc(l.fb)}</p>
      ${l.to!==l.from?`<p class="shift">${av(moodOf(l.to))}<span>${l.to>l.from?"زادت ثقة سارة بك":"قلّت ثقة سارة بك"}${moodOf(l.to)!==moodOf(l.from)?`، وأصبحت ${MOODS[moodOf(l.to)]}`:""}.</span></p>`:""}
      ${st.fac?`<p class="facmeta">أثر الرد: ${Object.keys(l.d).filter(k=>l.d[k]).map(k=>DIMS[k].name+" "+sign(l.d[k])).join("، ")||"لا تغيير"}</p>`:""}
      <div class="row"><button class="btn primary" data-act="next">${s.node==="END"?"شاهد النتيجة":"التالي"}</button></div>
    </section>`;
  } else {
    const node=NODES[s.node], list=choicesFor(s.node,s);
    h+=`<section class="card enter" aria-labelledby="q-h">
      <p class="label">${AREAS[node.area].name}${node.back?" (رجوع)":""} · <span class="en" lang="en">${AREAS[node.area].en}</span><br>${AREAS[node.area].q}</p>
      <p class="scene">${val(node.scene,s)}</p>
      <h2 id="q-h" tabindex="-1">ماذا تقول؟</h2>
      <div class="opts" role="radiogroup" aria-labelledby="q-h">
      ${list.map((c,i)=>`<button type="button" class="opt" role="radio" id="o-${c.id}" data-choice="${c.id}" aria-checked="${st.sel===c.id}" tabindex="${(st.sel?st.sel===c.id:i===0)?0:-1}">
        <span class="dot" aria-hidden="true"></span><span>${esc(val(c.text,s))}${st.fac?`<span class="facmeta">${pill(c.type)} ثقة ${sign(c.open||0)}${c.revisit?"، يرجع لمرحلة سابقة":""}</span>`:""}</span></button>`).join("")}
      </div>
      <div class="row"><button class="btn primary" data-act="say" ${st.sel?"":"disabled"}>قل هذا</button></div>
      ${st.fac?`<div class="fac"><span><b>للنقاش:</b> ${esc(node.fac)}</span>
        <span class="facmeta">الثقة: ${s.open} · تغيّر الأولويات: ${s.prio?"ظهر":"مخفي"} · الخوف من الاعتراض: ${s.fear?"ظهر":"مخفي"}</span></div>`:""}
    </section>`;
  }
  $("#app").innerHTML=h;
  const f=focus&&$(focus); if(f) f.focus();
}

function end(){
  const s=compute(st.hist), total=s.log.length, ratio=s.good/Math.max(1,total);
  const kind = ratio>=0.75?"coach" : ratio>=0.45?"mixed" : "direct";
  const quote = s.fear && kind!=="direct" ? "«شكرًا. دخلت متوقعة إني بتهزّأ، وطالعة بخطة أنا مقتنعة فيها.»"
    : s.fear ? "«شكرًا. يمكن ارتحت إني قلتها. بسوي اللي طلبته.»"
    : s.prio && kind!=="direct" ? "«فادني الكلام. للحين محتارة، بس على الأقل قلت شي منه.»"
    : kind==="direct" ? "«طيب. بخلّصه.» (تأخذ أغراضها وتطلع دون أن تلتفت)"
    : "«شكرًا. بحاول.» (تبتسم، لكن ابتسامتها باهتة)";
  const truths=[
    ["الأولويات تتغير باستمرار", s.prio, "طلبات مكتب المدير العام تغيّر خطتها عدة مرات في الأسبوع. التأخير نتيجة لذلك، لا لسوء إدارة الوقت."],
    ["الخوف من الاعتراض", s.fear, "اعترضت مرة في اجتماع، فانتُقدت أمام الجميع. ومن يومها تقول «أبشر» لكل شيء."],
    ["دورك أنت", s.fear, "حين حدثتك عن الضغط، قلت لها «سوّي اللي تقدرين عليه». ففهمت أن الكلام لا فائدة منه."]
  ];
  const traps=s.log.filter(l=>!TYPES[l.type].good).length;
  const R=st.refl||{};
  $("#app").innerHTML=`<div class="end enter">
    <div class="end-top">
      <h1 id="end-h" tabindex="-1">انتهت الجلسة</h1>
      <div class="quote-wrap">${av(moodOf(s.open))}<p class="quote"><span>${esc(quote.replace(/[«»]/g,""))}</span></p></div>
      <div class="score"><span class="big">${s.good} من ${total}</span><span>من ردودك كانت كوتشينغ (سؤال قوي، إصغاء، أو دعم).</span></div>
      <div class="bar" role="img" aria-label="${s.good} كوتشينغ و${s.trap} فخ"><span style="width:${ratio*100}%"></span></div>
    </div>

    <section class="part" aria-labelledby="t-h"><h2 id="t-h">ماذا كان يحدث فعلًا؟</h2>
      <div class="three">${truths.map(([h,ok,p])=>`<div class="card"><span class="pill ${ok?"good":"trap"}">${ok?"✓ اكتشفته":"✗ لم يظهر"}</span><h3>${h}</h3><p>${p}</p></div>`).join("")}</div>
    </section>

    <section class="part" aria-labelledby="p-h"><h2 id="p-h">مستقبلان محتملان</h2>
      <p class="note">هذه أنماط شائعة، لا توقعات مؤكدة. لا توجد جلسة واحدة تضمن أي نتيجة.</p>
      <div class="two">
        <div class="card ${kind==="direct"?"mine":""}">${kind==="direct"?`<span class="pill trap">الأقرب لجلستك</span>`:""}<h3>إذا بقي الأسلوب توجيهيًا</h3>
          <ul><li>تنفّذ سارة خطتك، وقد يتحسن الأداء قليلًا لأنها تحت المراقبة.</li>
          <li>يأتي طلب عاجل جديد، فتنهار الخطة، ولا تجرؤ على قول ذلك.</li>
          <li>بعد أشهر: صمت وساعات أطول ومشاكل تُكتشف متأخرة. قد تتعافى، وقد تفقد حماسها أو تغادر.</li></ul></div>
        <div class="card ${kind==="coach"?"mine":""}">${kind==="coach"?`<span class="pill good">الأقرب لجلستك</span>`:""}<h3>إذا كان الأسلوب كوتشينغ</h3>
          <ul><li>تعمل سارة بخطة كتبتها بنفسها، وأنت تعرف الآن السبب الحقيقي.</li>
          <li>الطلب العاجل التالي يُسجَّل ويمر عليك، فتصبح المشكلة مرئية لمن يقدر على حلها.</li>
          <li>بعد أشهر: قد لا يتغير المدير العام، لكن المشكلة صارت مشتركة لا مخفية، وأنت في موقع يسمح لك بدعمها.</li></ul></div>
      </div>
    </section>

    <section class="part" aria-labelledby="l-h"><h2 id="l-h">تقييمك في أربعة جوانب</h2>
      <div class="levels">${Object.keys(DIMS).map(k=>`<div class="lv"><b>${DIMS[k].name}</b><span class="lvl">${LEVELS[level(k,s.sc[k])]}</span><span class="what">${DIMS[k].what}</span></div>`).join("")}</div>
      <details><summary>كيف حُسب التقييم؟</summary><div class="inner">
        <p>كل ردّ يضيف نقاطًا أو ينقصها في هذه الجوانب. الأسئلة القوية والإصغاء تزيدها غالبًا. النصيحة المبكرة والافتراض تُنقص ملكية سارة للحل غالبًا، حتى لو زادت الوضوح.</p>
        <p>نقاطك: ${Object.keys(DIMS).map(k=>`${DIMS[k].name} ${s.sc[k]} (بداية حتى ${DIMS[k].bands[0]}، متمكّن من ${DIMS[k].bands[1]+1})`).join("، ")}.</p>
        <p>هذا تقييم تعليمي للتأمل فقط. لم يُختبر علميًا، ولا يقيس قدراتك أو شخصيتك، بل يصف اختياراتك في هذه الجلسة وحدها.</p></div></details>
    </section>

    <section class="part" aria-labelledby="r-h"><h2 id="r-h">راجع قراراتك</h2>
      <p class="note">${traps?`وقعت في الفخ ${traps} ${traps===1?"مرة":"مرات"}. هذه ردودك، ومعها خيار أفضل حيث يلزم.`:"لم تقع في أي فخ. هذه ردودك كاملة."}</p>
      <ol class="review">${s.log.map((l,i)=>`<li>
        <div class="top"><span class="label">${i+1}. ${AREAS[l.area].name}${l.back?" (رجوع)":""}</span>${pill(l.type)}</div>
        <p>${esc(l.text)}</p>
        ${l.better?`<p class="better"><b>خيار أفضل:</b> ${esc(l.better.text)}</p>`:""}
      </li>`).join("")}</ol>
      <div class="start">${["G","R","O","W"].filter(a=>s.log.some(l=>l.area===a&&!l.back)).map(a=>`<button class="btn" data-retry="${a}">أعد من ${AREAS[a].name}</button>`).join("")}</div>
    </section>

    <section class="part" aria-labelledby="f-h"><h2 id="f-h">لحظة تأمل</h2>
      <form class="reflect" id="refl">
        <div><label for="q1">متى شعرت بأقوى رغبة في إعطاء النصيحة؟ ولماذا؟</label><textarea id="q1">${esc(R.q1||"")}</textarea></div>
        <div><label for="q2">ما الشيء الوحيد الذي ستفعله بشكل مختلف في لقائك القادم مع أحد موظفيك؟</label><textarea id="q2">${esc(R.q2||"")}</textarea></div>
        <div class="start"><button class="btn" type="button" data-act="copy">انسخ إجاباتي</button><button class="btn primary" type="button" data-act="restart">ابدأ جلسة جديدة</button></div>
        <p class="ok" id="ok" role="status"></p>
        <p class="note">إجاباتك محفوظة في هذا المتصفح فقط.</p>
      </form>
    </section>
  </div>`;
}

function render(focus){
  tools();
  if(st.screen==="intro") intro();
  else if(st.screen==="sim") sim(focus);
  else { end(); const f=focus&&$(focus); if(f) f.focus(); }
}

/* ============ الأحداث ============ */
function reset(){ Object.assign(st,{screen:"intro",hist:[],waiting:false,sel:null,refl:{},confirming:false}); save(); render(); window.scrollTo(0,0); }
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.choice){ st.sel=b.dataset.choice; save(); sim("#o-"+st.sel); return; }
  if(b.dataset.retry){
    const s=compute(st.hist), i=s.log.findIndex(l=>l.area===b.dataset.retry&&!l.back);
    st.hist=st.hist.slice(0,i); Object.assign(st,{waiting:false,sel:null,screen:"sim"}); save(); render("#q-h"); window.scrollTo(0,0); return;
  }
  switch(b.dataset.act){
    case "start": Object.assign(st,{hist:[],waiting:false,sel:null,screen:"sim"}); save(); render("#q-h"); break;
    case "resume": st.screen="sim"; save(); render(st.waiting?"#fb-h":"#q-h"); break;
    case "say": { if(!st.sel) return; st.hist.push(st.sel); st.sel=null; st.waiting=true; save();
      const s=compute(st.hist); announce("سارة: "+s.log[s.log.length-1].reply); render("#fb-h"); break; }
    case "next": st.waiting=false; save(); render("#q-h"); if(st.screen==="end") window.scrollTo(0,0); break;
    case "fac": st.fac=!st.fac; save(); render(); break;
    case "reset": st.confirming=true; tools(); break;
    case "reset-no": st.confirming=false; tools(); break;
    case "reset-yes": case "restart": reset(); break;
    case "copy": {
      const s=compute(st.hist), R=st.refl||{};
      const txt=`فخ النصيحة: تأملاتي\nردود كوتشينغ: ${s.good} من ${s.log.length}\n`+
        Object.keys(DIMS).map(k=>`${DIMS[k].name}: ${LEVELS[level(k,s.sc[k])]}`).join("\n")+
        `\n\n${$("label[for=q1]").textContent}\n${R.q1||"-"}\n\n${$("label[for=q2]").textContent}\n${R.q2||"-"}`;
      const ok=$("#ok"), fail=()=>ok.textContent="النسخ غير متاح هنا. حدّد النص وانسخه يدويًا.";
      try{ navigator.clipboard.writeText(txt).then(()=>ok.textContent="تم النسخ.",fail); }catch(err){ fail(); }
      break; }
  }
});
document.addEventListener("input",e=>{ if(e.target.closest("#refl")){ st.refl[e.target.id]=e.target.value; save(); } });
document.addEventListener("keydown",e=>{
  const c=e.target.closest&&e.target.closest(".opt"); if(!c) return;
  const all=[...document.querySelectorAll(".opt")], i=all.indexOf(c); let n=null;
  if(e.key==="ArrowDown"||e.key==="ArrowLeft") n=all[(i+1)%all.length];
  if(e.key==="ArrowUp"||e.key==="ArrowRight") n=all[(i-1+all.length)%all.length];
  if(n){ e.preventDefault(); st.sel=n.dataset.choice; save(); sim("#o-"+st.sel); }
});
render();
</script>

</body>
</html>
